[tool:pytest]
DJANGO_SETTINGS_MODULE = Blacphics.settings
testpaths = tests
addopts =
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=branches
    --cov=orders
    --cov=products
    --cov=customers
    --cov=finance
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80
python_files = test_*.py
python_classes = Test*
python_functions = test_*